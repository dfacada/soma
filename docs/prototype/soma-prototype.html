  // ───────────────────────── Activity ─────────────────────────

  // ───────────────────────── Insights ─────────────────────────
  function viewInsights() {
    const n = UI.insightRange; const t = today(); const keys = []; for (let i = n - 1; i >= 0; i--) keys.push(dkey(addDays(t, -i)));
    const buckets = [{ label: 'under 6.5h', good: 0, tot: 0 }, { label: '6.5 – 7.5h', good: 0, tot: 0 }, { label: 'over 7.5h', good: 0, tot: 0 }];
    let bestDays = 0, walkBest = 0, entries = 0, hard = 0, hardLowSleep = 0, hardDrinks = 0, skipProt = 0, skipped = 0;
    keys.forEach(kk => {
      const c = ciValid(kk); const sl = S.sleep[kk]; entries += S.journal.filter(j => j.date === kk).length;
      if (!c || sl === undefined) return;
      const b = sl < 390 ? 0 : sl <= 450 ? 1 : 2; buckets[b].tot++; if (GOOD[c.mood]) buckets[b].good++;
      if (GOOD[c.mood]) { bestDays++; if ((S.activity[kk] || {}).walk) walkBest++; }
      if (c.mood === 'Down' || c.mood === 'Overwhelmed' || c.mood === 'Anxious') { hard++; if (sl < 360) hardLowSleep++; if (((c.counts || {}).drinks || 0) >= 3) hardDrinks++; }
      if (!isRest(roundDay(fromKey(kk))) && pushCount(kk) === 0) { skipped++; if (proteinOf(kk) < 90) skipProt++; }
    });
    const pctOf = (b) => b.tot ? Math.round(b.good / b.tot * 100) : 0;
    const bars = buckets.map((b, i) => { const p = pctOf(b); const h = Math.round(p / 100 * 80); const x = 60 + i * 96; return '<rect x="' + x + '" y="' + (92 - h) + '" width="56" height="' + h + '" rx="3" fill="' + ['#C9C7E9', '#8F8CD3', '#5F5BBF'][i] + '"></rect><text x="' + (x + 28) + '" y="' + (86 - h) + '" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#1B1A17">' + p + '%</text><text x="' + (x + 28) + '" y="112" text-anchor="middle" font-family="Figtree, sans-serif" font-size="11" fill="#6E6A62">' + b.label + '</text><text x="' + (x + 28) + '" y="126" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#8A857B">' + b.tot + ' nights</text>'; }).join('');
    const segs = [14, 30, 90].map(v => '<button class="seg ' + (n === v ? 'on' : '') + '" data-a="range" data-x="' + v + '">' + v + 'd</button>').join('');
    return '<div class="h1"><div><div class="eb">Last ' + n + ' days · ' + entries + ' entries</div><div class="d title">Insights</div></div><div style="display:flex;gap:2px;background:#FFFFFF;border:1px solid #DCD9D0;border-radius:999px;padding:3px;margin-bottom:4px;">' + segs + '</div></div>' +
      '<div class="card"><div style="display:flex;align-items:center;gap:8px;"><span style="width:8px;height:8px;border-radius:999px;background:#5F5BBF;"></span><span class="eb" style="color:#1B1A17;">Your best-day signal</span></div>' +
      '<p style="font-size:14px;line-height:1.55;">Your <strong>Focused</strong>, <strong>Great</strong> and <strong>Peaceful</strong> days mostly start the same way: a walk and a decent night before. On ' + walkBest + ' of your ' + bestDays + ' best days in this window you had logged a walk. You said it yourself: <em>"every day I get it in before noon the rest of the day just lines up."</em></p>' +
      '<p style="font-size:14px;line-height:1.55;">' + (skipped ? 'On the ' + skipped + ' day' + (skipped > 1 ? 's' : '') + ' you skipped the push-ups, ' + skipProt + ' also came in under 90 g of protein.' : 'You have not skipped the push-ups in this window.') + '</p></div>' +
      '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;"><span class="eb" style="color:#1B1A17;">Mood by sleep</span><span style="font-size:11px;color:#6E6A62;">Share of days rated Focused, Great, Peaceful or Grateful</span></div>' +
      '<svg width="326" height="132" viewBox="0 0 326 132" style="max-width:100%;"><line x1="36" y1="12" x2="326" y2="12" stroke="#ECEAE3"></line><line x1="36" y1="52" x2="326" y2="52" stroke="#ECEAE3"></line><line x1="36" y1="92" x2="326" y2="92" stroke="#ECEAE3"></line><text x="30" y="16" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="#8A857B">100%</text><text x="30" y="56" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="#8A857B">50%</text><text x="30" y="96" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="#8A857B">0%</text>' + bars + '</svg></div>' +
      '<div class="card"><div style="display:flex;align-items:center;gap:8px;"><span style="width:8px;height:8px;border-radius:999px;background:#B7692A;"></span><span class="eb" style="color:#1B1A17;">Your hardest-day signal</span></div>' +

      '<div class="card" style="flex-direction:row;align-items:center;gap:12px;background:#ECEBF8;border-color:#ECEBF8;box-shadow:none;"><span style="color:#3F3C8F;">' + ICON.lock + '</span><div style="font-size:12px;color:#3F3C8F;line-height:1.45;">Transcripts are decrypted on this phone and sent for analysis once. Nothing is stored on the server in plain text.</div></div>';

    const fab = $('fab');
    if (S.tab === 'journal') {
      fab.innerHTML = (UI.recording ? '<span class="m" style="font-size:12px;background:#1B1A17;color:#F4F3EF;padding:4px 10px;border-radius:999px;">Recording · ' + clock(UI.recSec) + ' · tap to stop</span>' : '') +
        '<button class="mic ' + (UI.recording ? 'rec' : '') + '" data-a="rec" aria-label="record"><span style="color:#fff;">' + ICON.mic(26) + '</span></button>';
    } else fab.innerHTML = '';
    renderSheet();
  }

  // ───────────────────────── actions ─────────────────────────
  function act(a, x) {
    const k = tkey();
    switch (a) {
      case 'tab': S.tab = x; UI.checkinOpen = null; UI.sheet = null; break;
      case 'mood': { const c = S.checkins[k] || { mood: null, habits: {}, drinks: 0 }; if (c.mood === x) { c.mood = null; S.checkins[k] = c; UI.checkinOpen = true; } else { c.mood = x; S.checkins[k] = c; UI.checkinOpen = false; toast('Checked in: ' + x); } break; }
      case 'habit': { const c = S.checkins[k] || { mood: null, habits: {}, drinks: 0 }; c.habits[x] = !c.habits[x]; S.checkins[k] = c; break; }
      case 'count': { const c = S.checkins[k] || { mood: null, habits: {}, counts: {} }; c.counts = c.counts || {}; c.counts[x] = ((c.counts[x] || 0) + 1) % 10; S.checkins[k] = c; break; }
      case 'tog': setPath(S, x, !getPath(S, x)); break;
      case 'mood-on': { const m = S.settings.moods.filter(z => z.id === x)[0]; if (m.on && S.settings.moods.filter(z => z.on).length <= 1) { toast('Keep at least one mood'); return; } m.on = !m.on; break; }
      case 'hab-add': { const inp = $('hab-new'); const v = (inp && inp.value || '').trim(); if (!v) return; if (S.settings.habits.length >= 12) { toast('Keep it focused: max 12 habits'); return; } S.settings.habits.push({ id: slug(v), label: v, type: 'daily' }); toast('Added ' + v); break; }
      case 'hab-del': { if (S.settings.habits.length <= 1) { toast('Keep at least one habit'); return; } S.settings.habits.splice(Number(x), 1); break; }
      case 'hab-type': { const h = S.settings.habits[Number(x)]; h.type = h.type === 'counter' ? 'daily' : 'counter'; if (h.type === 'counter' && !h.dir) h.dir = 'at_least'; break; }
      case 'hab-dir': { const h = S.settings.habits[Number(x)]; h.dir = h.dir === 'at_most' ? 'at_least' : 'at_most'; break; }
      case 'act-add': { const inp = $('act-new'); const v = (inp && inp.value || '').trim(); if (!v) return; S.settings.activityTypes.push({ key: slug(v), name: v }); toast('Added ' + v); break; }
      case 'act-del': { if (S.settings.activityTypes.length <= 1) { toast('Keep at least one activity type'); return; } S.settings.activityTypes.splice(Number(x), 1); break; }
      case 'snack-add': { const n = $('snack-new'); const kc = $('snack-kcal'); const v = (n && n.value || '').trim(); const kv = parseInt(kc && kc.value, 10); if (!v || isNaN(kv)) return; S.settings.snacks.push({ name: v, kcal: kv }); break; }
      case 'snack-del': S.settings.snacks.splice(Number(x), 1); break;
      case 'rest': { const d = Number(x); const i = S.round.rest.indexOf(d); if (i >= 0) S.round.rest.splice(i, 1); else S.round.rest.push(d); S.round.rest.sort((p, q) => p - q); break; }
      case 'rest-default': S.round.rest = defaultRestDays(S.round.length); toast('Default rest pattern restored'); break;
      case 'kcal-preset': { const n = Number(x); const g = S.goals; const ratio = n / (g.kcal || 2100); g.kcal = n; g.protein = Math.round(g.protein * ratio); g.carbs = Math.round(g.carbs * ratio); g.fat = Math.round(g.fat * ratio); break; }
      case 'plan-defaults': { const p = { standard: [2100, 200, 150, 75], paleo: [2100, 175, 145, 85], keto: [2100, 180, 23, 140] }[S.settings.plan] || [2100, 200, 150, 75]; S.goals.kcal = p[0]; S.goals.protein = p[1]; S.goals.carbs = p[2]; S.goals.fat = p[3]; toast('Targets reset to the ' + S.settings.plan + ' plan'); break; }
      case 'member-status': { const m = S.members[Number(x)]; m.status = m.status === 'active' ? 'disabled' : 'active'; break; }
      case 'member-role': { const m = S.members[Number(x)]; m.role = m.role === 'admin' ? 'member' : 'admin'; break; }
      case 'round-archive': S.round.archived = !S.round.archived; toast(S.round.archived ? 'Round archived' : 'Round re-opened'); break;
      case 'export': toast('Export prepared: ' + x + ' (download is simulated in the prototype)'); return;
      case 'clear-logs': if (confirm('Clear every daily log? Plans, recipes and settings stay.')) { S.eaten = {}; S.extras = {}; S.weight = {}; S.activity = {}; S.checkins = {}; toast('Daily logs cleared'); } break;
      case 'passphrase': toast('Passphrase change is a production feature; nothing to change in the prototype'); return;
      case 'checkin-toggle': UI.checkinOpen = !(UI.checkinOpen === null ? false : UI.checkinOpen); break;
      case 'meal': { const e = eatenOf(k); e[x] = !e[x]; S.eaten[k] = e; break; }
      case 'act': { const av = actOf(k); av[x] = !av[x]; S.activity[k] = av; break; }
      case 'push-open': UI.sheet = { type: 'push' }; break;
      case 'preview': UI.preview = !UI.preview; try { localStorage.setItem('soma-proto-preview', UI.preview ? '1' : '0'); } catch (e) { /* ignore */ } break;
      case 'setsec': UI.setSection = x; break;
      case 'push-nudge': { const inp = $('push-inp'); if (!inp) return; const cur = parseInt(inp.value, 10); const base = isNaN(cur) ? (isRest(roundDay()) ? 0 : target(roundDay())) : cur; inp.value = Math.max(0, base + Number(x)); return; }
      case 'push-target': { const av = actOf(k); av.pushups = target(roundDay()); S.activity[k] = av; UI.sheet = null; toast('Target hit · ' + av.pushups + ' push-ups'); break; }
      case 'push-save': { const inp = $('push-inp'); const v = parseInt(inp && inp.value, 10); if (isNaN(v) || v < 0) return; const av = actOf(k); av.pushups = v; S.activity[k] = av; UI.sheet = null; toast(v ? v + ' push-ups logged' : 'Push-ups cleared'); break; }
      case 'push-clear': { const av = actOf(k); av.pushups = 0; S.activity[k] = av; UI.sheet = null; break; }
      case 'rec': toggleRec(); return;
      case 'play': togglePlay(x); return;
      case 'del-journal': S.journal = S.journal.filter(j => j.id !== x); break;
      case 'swap': UI.sheet = { type: 'swap', meal: x }; break;
      case 'swap-pick': { const r = RECIPES[Number(x)]; S.plan[UI.sheet.meal] = r; UI.sheet = null; toast('Planned: ' + r.name); break; }
      case 'sheet-close': UI.sheet = null; break;
      case 'add-extra': { const inp = $('extra-inp'); const txt = (inp && inp.value || '').trim(); if (!txt) return; const words = txt.split(/\s+/).length; const kcal = Math.min(900, 180 + words * 65); const ex = extrasOf(k); ex.push({ name: txt, kcal: kcal, protein: Math.round(kcal / 26) }); S.extras[k] = ex; toast('Added · ~' + kcal + ' kcal'); break; }
      case 'del-extra': { const ex = extrasOf(k); ex.splice(Number(x), 1); S.extras[k] = ex; break; }
      case 'weight': { const inp = $('w-inp'); const v = parseFloat(inp && inp.value); if (!v) return; S.weight[k] = Math.round(v * 10) / 10; toast('Weight logged'); break; }
      case 'range': UI.insightRange = Number(x); break;
      case 'approve': { const p = S.pending.splice(Number(x), 1)[0]; S.members.push({ name: p.email.split('@')[0], hit: 0 }); toast('Approved ' + p.email); break; }
      case 'resolve': S.errors[Number(x)].open = false; break;
      case 'ack': S.feedback[Number(x)].ack = true; break;
      case 'vault': S.profile.vault = !S.profile.vault; toast(S.profile.vault ? 'Vault unlocked' : 'Vault locked'); break;
      case 'signout': toast('Signed out (simulated)'); return;
      case 'retry-all': { let n = 0; S.journal.forEach(j => { if (j.status === 'transcribing') { j.status = 'done'; j.text = j.text || SAMPLE_TRANSCRIPTS[0]; n++; } }); toast(n ? n + ' transcript' + (n > 1 ? 's' : '') + ' recovered' : 'Nothing stuck'); break; }
      case 'fitbit-sync': toast('Fitbit synced (simulated)'); return;
      case 'delete-account': toast('Account deletion is a production action; nothing happens in the prototype'); return;
      case 'clock-live': S.clockOverride = null; break;
      case 'day': { closeOutToday(); S.offset += Number(x); UI.checkinOpen = null; seedDayIfMissing(); break; }
      case 'reset': if (confirm('Reset the prototype to its sample data?')) { S = makeSeed(); UI.checkinOpen = null; toast('Reset'); } break;
      default: return;
    }
    save(); render();
  }
  function closeOutToday() { const k = tkey(); S.closed[k] = dayStatus(k).closed; }
  function seedDayIfMissing() {
    const k = tkey();
    if (S.sleep[k] === undefined) { S.sleep[k] = 380 + Math.round(Math.random() * 90); }
    if (S.steps[k] === undefined) { S.steps[k] = 2500 + Math.round(Math.random() * 6000); }
  }
  function ciValid(k) { const c = S.checkins[k]; return c && c.mood ? c : null; }

  function toggleRec() {
    if (UI.recording) {
      clearInterval(UI.recTimer); UI.recTimer = null; UI.recording = false;
      const dur = Math.max(1, UI.recSec); const now = new Date(); const mins = nowMins();
      const h = Math.floor(mins / 60); const time = ((h % 12) || 12) + ':' + pad(mins % 60) + (h < 12 ? ' am' : ' pm');
      const c = ciValid(tkey());
      const entry = { id: 'j' + Date.now(), date: tkey(), time: time, dur: dur, mood: c ? c.mood : null, text: '', status: 'transcribing' };
      S.journal.unshift(entry); save(); render(); toast('Saved · ' + clock(dur) + ' · transcribing');
      setTimeout(() => { entry.text = SAMPLE_TRANSCRIPTS[(S.journal.length + dur) % SAMPLE_TRANSCRIPTS.length]; entry.status = 'done'; save(); render(); }, 4000 + Math.min(6000, dur * 100));
      void now;
    } else {
      UI.recording = true; UI.recSec = 0; render();
      UI.recTimer = setInterval(() => { UI.recSec++; render(); }, 1000);
    }
  }
  function togglePlay(id) {
    if (UI.playing === id) { clearInterval(UI.playTimer); UI.playing = null; render(); return; }
    clearInterval(UI.playTimer); UI.playing = id; render();
    const j = S.journal.filter(x => x.id === id)[0]; if (!j) return;
    let t = 0; const step = Math.max(1, Math.round(j.dur / 12));
    UI.playTimer = setInterval(() => { t += step; const bar = $('pbar'); if (bar) bar.style.width = Math.min(100, t / j.dur * 100) + '%'; if (t >= j.dur) { clearInterval(UI.playTimer); UI.playing = null; render(); } }, 900);
  }

  // ───────────────────────── events ─────────────────────────
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-a]'); if (!el) return;
    if (el.dataset.a === 'sheet-close' && ev.target.closest('[data-stop]') && !ev.target.closest('.lnk')) return;
    act(el.dataset.a, el.dataset.x);
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { const el = ev.target.closest('[data-enter]'); if (el) { act(el.dataset.enter); return; } }
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('[role="button"][data-a]')) { ev.preventDefault(); act(ev.target.dataset.a, ev.target.dataset.x); }
  });
  document.addEventListener('input', (ev) => { const el = ev.target.closest('[data-input]'); if (!el) return; if (el.dataset.input === 'clock') { S.clockOverride = Number(el.value); save(); const lbl = el.previousElementSibling.querySelector('.m'); if (lbl) lbl.textContent = pad(Math.floor(S.clockOverride / 60)) + ':' + pad(S.clockOverride % 60) + ' · set'; } });
  document.addEventListener('change', (ev) => {
    const el = ev.target.closest('[data-input]'); if (el && el.dataset.input === 'clock') render();
    const s = ev.target.closest('[data-set]'); if (!s) return;
    let v = s.value;
    if (s.dataset.type === 'num') { v = parseFloat(v); if (isNaN(v)) return; if (s.min !== '' && v < Number(s.min)) v = Number(s.min); if (s.max !== '' && v > Number(s.max)) v = Number(s.max); }
    if (s.dataset.type === 'bool') v = !!s.checked;
    if (s.dataset.set === 'goals.kcal') {
      // Typing a calorie figure rescales protein, carbs and fat in proportion, same as the quick-set chips.
      const g = S.goals; const ratio = v / (g.kcal || v || 1);
      g.protein = Math.round(g.protein * ratio); g.carbs = Math.round(g.carbs * ratio); g.fat = Math.round(g.fat * ratio);
    }
    setPath(S, s.dataset.set, v);
    if (s.dataset.set === 'round.length') { S.round.rest = S.round.rest.filter(d => d <= S.round.length); }
    save(); render();
  });

  window.addEventListener('resize', () => { layout(); });
  seedDayIfMissing();
  render();
})();
</script>
